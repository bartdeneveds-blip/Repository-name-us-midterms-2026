name: Update election results

on:
  workflow_dispatch:
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: write

concurrency:
  group: update-election-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update CSV files from CivicAPI
        run: python scripts/update_results.py

           - name: Commit changed CSV files
        run: |
          if git diff --quiet -- data/; then
            echo "Geen wijzigingen in de CSV-bestanden."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/house.csv data/senate.csv data/house_seats.csv data/senate_seats.csv data/governors_seats.csv
          git commit -m "Update CivicAPI election data"
          git push
